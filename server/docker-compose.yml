# Docker Compose for PowerDon infrastructure
version: '3.8'

services:
  # TCP Proxy Server
  tcp-proxy:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8088:8088"  # TCP for station connections
      - "8089:8089"  # HTTP/WebSocket for management
    environment:
      - TCP_PORT=8088
      - TCP_HOST=0.0.0.0
      - WS_PORT=8089
      - API_BASE_URL=http://host.docker.internal:3000
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8089/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - powerdon

  # Optional: Station Simulator for testing
  simulator:
    build:
      context: ..
      dockerfile: server/Dockerfile.simulator
    environment:
      - PROXY_HOST=tcp-proxy
      - PROXY_PORT=8088
      - STATION_COUNT=3
      - SIMULATION_MODE=realistic
    depends_on:
      - tcp-proxy
    profiles:
      - testing
    networks:
      - powerdon

networks:
  powerdon:
    driver: bridge

volumes:
  proxy_logs:
